<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Каталог мебели МегаМебель - столы, стулья, шкафы и многое другое.">
  <title>МегаМебель - Каталог</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-dark text-light">
  

  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark slide-in">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" alt="МегаМебель" width="32">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link active" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Услуги</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">О компании</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Корзина</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Каталог -->
  <section class="catalog py-5 bg-dark">
    <div class="container">
      <h2 class="text-center mb-5 display-5 fade-in-up">Каталог продукции</h2>
      <div class="row mb-4 align-items-center">
        <div class="col-md-6">
          <input type="text" id="search-input" class="form-control bg-dark text-light border-light fade-in-up delay-1" placeholder="Поиск по названию или описанию">
        </div>
        <div class="col-md-6 text-md-end">
          <div class="category-filter">
            <button class="btn btn-outline-custom me-2 active pulse fade-in-up delay-2" data-category="all">Все</button>
            <button class="btn btn-outline-custom me-2 pulse fade-in-up delay-3" data-category="tables">Столы</button>
            <button class="btn btn-outline-custom me-2 pulse fade-in-up delay-4" data-category="chairs">Стулья</button>
            <button class="btn btn-outline-custom me-2 pulse fade-in-up delay-5" data-category="cabinets">Шкафы</button>
            <button class="btn btn-outline-custom pulse fade-in-up delay-6" data-category="sofas">Диваны</button>
          </div>
        </div>
      </div>
      <div class="row" id="product-list">
        <!-- Продукты добавляются через JS -->
      </div>
    </div>
  </section>

  <!-- Футер -->
  <footer class="bg-dark text-light py-5 slide-up">
    <div class="container">
      <div class="row">
        <div class="col-md-4 fade-in-up delay-1">
          <h5 class="fw-bold">МегаМебель</h5>
          <p>Качественная мебель с 2005 года</p>
        </div>
        <div class="col-md-4 fade-in-up delay-2">
          <h5 class="fw-bold">Контакты</h5>
          <p>Email: <a href="mailto:info@megamebel.ru" class="text-light">info@megamebel.ru</a><br>Тел: +7 (999) 123-45-67</p>
        </div>
        <div class="col-md-4 fade-in-up delay-3">
          <h5 class="fw-bold">Подписка</h5>
          <form class="d-flex">
            <input type="email" class="form-control me-2 bg-dark text-light border-light fade-in-up delay-4" placeholder="Ваш email">
            <button class="btn btn-custom fade-in-up delay-5" type="submit">Подписаться</button>
          </form>
          <div class="mt-3 social-links">
            <a href="#" class="text-light me-3 pulse"><i class="bi bi-vk"></i></a>
            <a href="#" class="text-light pulse"><i class="bi bi-instagram"></i></a>
          </div>
        </div>
      </div>
      <div class="text-center mt-4 fade-in-up delay-6">
        <p class="mb-0">© 2025 МегаМебель. Все права защищены.</p>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
