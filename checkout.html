<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>МегаМебель - Оформление заказа</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Навигация -->
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <img src="img/logo.png" alt="МегаМебель" width="40">
        МегаМебель
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
          <li class="nav-item"><a class="nav-link" href="cart.html">Корзина</a></li>
          <li class="nav-item"><a class="nav-link active" href="checkout.html">Оформление заказа</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
          <li class="nav-item"><a class="nav-link" href="contacts.html">Контакты</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Оформление заказа -->
  <section class="checkout py-5">
    <div class="container py-5">
      <h2 class="text-center mb-5">Оформление заказа</h2>

      <!-- Сообщение об ошибке или успехе -->
      <div id="form-message" class="mb-4"></div>

      <div class="row">
        <!-- Форма для данных покупателя -->
        <div class="col-md-6">
          <h4>Данные для доставки</h4>
          <form id="checkout-form">
            <div class="mb-3">
              <label for="name" class="form-label">ФИО</label>
              <input type="text" class="form-control" id="name" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="mb-3">
              <label for="address" class="form-label">Адрес доставки</label>
              <input type="text" class="form-control" id="address" placeholder="г. Москва, ул. Ленина, д. 10, кв. 5" required>
            </div>
            <div class="mb-3">
              <label for="phone" class="form-label">Телефон</label>
              <input type="tel" class="form-control" id="phone" placeholder="+7 (999) 123-45-67" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
            </div>
            <div class="mb-3">
              <label for="delivery-method" class="form-label">Способ доставки</label>
              <select class="form-select" id="delivery-method" required>
                <option value="" disabled selected>Выберите способ доставки</option>
                <option value="courier">Курьерская доставка</option>
                <option value="pickup">Самовывоз</option>
              </select>
            </div>
            <button type="submit" class="btn btn-custom">Подтвердить заказ</button>
          </form>
        </div>

        <!-- Список товаров в заказе -->
        <div class="col-md-6">
          <h4>Ваш заказ</h4>
          <div id="order-items" class="mb-4"></div>
          <div class="text-end">
            <h4>Итого: <span id="order-total">0 ₽</span></h4>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Футер -->
  <footer class="py-4 text-center">
    <div class="container">
      <p>© 2025 МегаМебель. Все права защищены.</p>
      <div class="social-links">
        <a href="#" class="me-3"><i class="bi bi-telegram"></i></a>
        <a href="#"><i class="bi bi-whatsapp"></i></a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
